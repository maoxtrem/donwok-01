services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: donwok_app
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      - /run/cups/cups.sock:/run/cups/cups.sock
    environment:
      PRINTER_NAME: T86LR
    command: sh -c "composer install --no-interaction --prefer-dist --no-progress && php-fpm -F"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: donwok_worker
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    command: sh -c "composer install --no-interaction --prefer-dist --no-progress && php bin/console messenger:consume async --time-limit=3600 --no-interaction"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: donwok_nginx
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - backend

  database:
    image: mysql:8.4
    container_name: donwok_database
    environment:
      MYSQL_DATABASE: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: donwok_redis
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: donwok_minio
    restart: unless-stopped
    env_file:
      - ./app/.env.local
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  mercure:
    image: dunglas/mercure:latest
    container_name: donwok_mercure
    restart: unless-stopped
    env_file:
      - ./app/.env.local
    environment:
      SERVER_NAME: ':80'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins *
        anonymous
    networks:
      - backend

networks:
  backend:
