services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: donwok_app
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      - /run/cups/cups.sock:/run/cups/cups.sock
    environment:
      PRINTER_NAME: T86LR
    command: sh -c "composer install --no-interaction --prefer-dist --no-progress && php-fpm -F"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: donwok_worker
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    command: sh -c "composer install --no-interaction --prefer-dist --no-progress && php bin/console messenger:consume async --time-limit=3600 --no-interaction"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: donwok_nginx
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - backend
      - office

  database:
    image: mysql:8.4
    container_name: donwok_database
    environment:
      MYSQL_DATABASE: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: donwok_redis
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: donwok_minio
    restart: unless-stopped
    env_file:
      - ./app/.env.local
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  mercure:
    image: dunglas/mercure:latest
    container_name: donwok_mercure
    restart: unless-stopped
    env_file:
      - ./app/.env.local
    environment:
      SERVER_NAME: ':80'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins *
        anonymous
    networks:
      - backend

  nextcloud-db-init:
    image: mysql:8.4
    container_name: donwok_nextcloud_db_init
    env_file:
      - ./.env.nextcloud.local
    environment:
      MYSQL_ROOT_PASSWORD: root
    command:
      - /bin/sh
      - -ec
      - |
        until mysqladmin ping --protocol=tcp --host=database --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent; do sleep 2; done
        mysql --protocol=tcp --host=database --user=root --password="$${MYSQL_ROOT_PASSWORD}" -e "
          CREATE DATABASE IF NOT EXISTS nextcloud CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE USER IF NOT EXISTS 'nextcloud'@'%' IDENTIFIED BY '$${MYSQL_PASSWORD}';
          GRANT ALL PRIVILEGES ON nextcloud.* TO 'nextcloud'@'%';
          FLUSH PRIVILEGES;
        "
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  nextcloud:
    image: nextcloud:35.0.2-apache
    container_name: donwok_nextcloud
    env_file:
      - ./.env.nextcloud.local
    environment:
      MYSQL_HOST: database
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 nextcloud osp-autocare-nginx"
      NEXTCLOUD_DEFAULT_PHONE_REGION: CO
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      nextcloud-db-init:
        condition: service_completed_successfully
    networks:
      - backend
      - office
    restart: unless-stopped

  nextcloud-cron:
    image: nextcloud:35.0.2-apache
    container_name: donwok_nextcloud_cron
    env_file:
      - ./.env.nextcloud.local
    environment:
      MYSQL_HOST: database
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    user: www-data
    working_dir: /var/www/html
    command:
      - /bin/sh
      - -ec
      - |
        until php occ status >/dev/null 2>&1; do sleep 5; done
        while true; do php -f cron.php; sleep 300; done
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      nextcloud:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  onlyoffice:
    image: onlyoffice/documentserver:10.0.0
    container_name: donwok_onlyoffice
    env_file:
      - ./.env.nextcloud.local
    environment:
      JWT_ENABLED: "true"
      JWT_HEADER: Authorization
      JWT_IN_BODY: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      USE_UNAUTHORIZED_STORAGE: "true"
    volumes:
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    networks:
      - office
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s

networks:
  backend:
  office:
    name: donwok_office

volumes:
  nextcloud_data:
  onlyoffice_logs:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_db:
