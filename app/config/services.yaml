parameters:
    printer_name_default: 'T86LR'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Donwok usa la cola compartida; puede sobrescribirse
            # con PRINTER_NAME sin impedir que carguen las rutas administrativas.
            string $printerName: '%env(default:printer_name_default:PRINTER_NAME)%'

    App\:
        resource: '../src/'

    App\Printing\PrinterInterface: '@App\Printing\CupsRawPrinter'

    App\Service\MercureTokenFactory:
        arguments:
            $secret: '%env(MERCURE_JWT_SECRET)%'
            $issuer: '%env(MERCURE_TRUSTED_ISSUERS)%'
            $audience: '%env(MERCURE_URL)%'

    App\Service\OrderRealtimePublisher:
        arguments:
            $topicBase: '%env(MERCURE_TRUSTED_ISSUERS)%'
